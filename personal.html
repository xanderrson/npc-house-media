<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal projects | Christian Anderson</title>
<meta name="description" content="Gaming clips, bloopers, and personal content from Christian Anderson's own YouTube channel and socials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE3;
    --ink: #201D18;
    --ink-soft: #3A352C;
    --muted: #6B6153;
    --accent: #35563F;
    --line: rgba(32,29,24,0.14);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,.display{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
  }
  a{ color:inherit; }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:0 28px;
  }
  header{ padding:48px 0 8px; }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.9rem;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
  }
  .back:hover{ border-color:var(--muted); }

  main{ padding:16px 0 100px; }
  h1{ font-size:clamp(2rem, 5vw, 2.6rem); margin:24px 0 12px; }
  .intro{ color:var(--ink-soft); max-width:60ch; margin-bottom:16px; font-size:1.05rem; }
  .channel-link{
    display:inline-block;
    margin-bottom:50px;
    font-size:0.95rem;
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }

  .category-block{ margin-bottom:56px; }
  .category-block h2{
    font-size:1.3rem;
    color:var(--accent);
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:20px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
  }
  .row:hover .row-title{ border-color:var(--accent); }
  .row-text{ min-width:0; }
  .row-title{
    font-size:1.05rem;
    font-weight:500;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
  }
  .row-credit{
    font-size:0.92rem;
    color:var(--muted);
    margin-top:4px;
  }
  .row-arrow{
    flex-shrink:0;
    color:var(--muted);
    font-size:0.9rem;
  }

  .empty{ padding:80px 0; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<header class="wrap">
  <a class="back" href="index.html">&larr; Back to portfolio</a>
</header>

<main class="wrap">
  <h1>Personal projects</h1>
  <p class="intro">Gaming clips, bloopers, and personal content from my own channel and socials — separate from the client work, just for fun.</p>
  <a class="channel-link" href="https://www.youtube.com/@skateyourfreedom123" target="_blank" rel="noopener">Visit my YouTube channel &rarr;</a>
  <div id="content"></div>
</main>

<script src="works-data.js"></script>
<script>
  function render(){
    const el = document.getElementById('content');
    const items = WORKS.filter(w => w.category.startsWith('Personal'));

    if (!items.length){
      el.innerHTML = '<div class="empty">Nothing listed yet.</div>';
      return;
    }

    const byCategory = {};
    const order = [];
    items.forEach(w => {
      if (!byCategory[w.category]){
        byCategory[w.category] = [];
        order.push(w.category);
      }
      byCategory[w.category].push(w);
    });

    el.innerHTML = order.map(cat => {
      const rows = byCategory[cat].map(w => `
        <a class="row" href="work.html?id=${encodeURIComponent(w.id)}">
          <div class="row-text">
            <div class="row-title">${w.title}</div>
            <div class="row-credit">${w.blurb}</div>
          </div>
          <div class="row-arrow">View &rarr;</div>
        </a>
      `).join('');
      return `<div class="category-block"><h2>${cat}</h2>${rows}</div>`;
    }).join('');
  }

  render();
</script>

</body>
</html>
