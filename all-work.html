<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All work | Optiflow Media</title>
<meta name="description" content="Full list of video and photo credits — live events, artist content, brand work, and personal projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE3;
    --ink: #201D18;
    --ink-soft: #3A352C;
    --muted: #6B6153;
    --accent: #35563F;
    --line: rgba(32,29,24,0.14);
    --frame-bg: #0E0C0A;
    --frame-muted: #9C9186;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,.display{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
  }
  a{ color:inherit; }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:0 28px;
  }

  nav.sitenav{
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:10;
  }
  nav.sitenav .wrap{
    display:flex;
    align-items:center;
    gap:28px;
    padding-top:20px;
    padding-bottom:20px;
    max-width:900px;
  }
  nav.sitenav a{
    text-decoration:none;
    font-family:'Oswald',sans-serif;
    font-size:0.95rem;
    color:var(--muted);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }
  nav.sitenav a.active{
    color:var(--ink);
    border-bottom-color:var(--accent);
  }
  nav.sitenav a:hover{ color:var(--ink); }

  main{ padding:40px 0 100px; max-width:900px; margin:0 auto; }
  h1{ font-size:clamp(2rem, 5vw, 2.6rem); margin:0 0 12px; padding:0 28px; }
  .intro{ color:var(--ink-soft); max-width:60ch; margin-bottom:32px; font-size:1.05rem; padding:0 28px; }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:0 28px;
    margin-bottom:44px;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:0.88rem;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .tab:hover{ border-color:var(--accent); }
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--bg);
    font-weight:600;
  }

  .content-area{ padding:0 28px; }
  .category-block{ margin-bottom:56px; }
  .category-block h2{
    font-size:1.3rem;
    color:var(--accent);
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
  }
  .row-thumb{
    flex-shrink:0;
    width:104px;
    height:78px;
    border-radius:2px;
    overflow:hidden;
    background:var(--frame-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row-thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.3s ease;
  }
  .row:hover .row-thumb img{ transform:scale(1.05); }
  .row-thumb .platform-label{
    color:var(--frame-muted);
    font-size:0.7rem;
    font-family:'Oswald',sans-serif;
    text-align:center;
    padding:0 6px;
  }
  .row-text{ min-width:0; flex:1; }
  .row-title{
    font-size:1.05rem;
    font-weight:500;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
  }
  .row:hover .row-title{ border-color:var(--accent); }
  .row-credit{
    font-size:0.92rem;
    color:var(--muted);
    margin-top:4px;
  }
  .row-arrow{
    flex-shrink:0;
    color:var(--muted);
    font-size:0.9rem;
  }

  .gallery-link-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:14px 0;
    border-top:1px dashed var(--line);
    font-size:0.92rem;
    color:var(--muted);
    font-style:italic;
  }
  .gallery-link-row a{
    font-style:normal;
    text-decoration:none;
    color:var(--accent);
    border-bottom:1px solid var(--accent);
    white-space:nowrap;
  }

  .empty{ padding:80px 0; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<nav class="sitenav">
  <div class="wrap">
    <a href="index.html">Portfolio</a>
    <a href="all-work.html" class="active">All Work</a>
    <a href="personal.html">Gaming</a>
  </div>
</nav>

<main>
  <h1>All work</h1>
  <p class="intro">Every credit in one place — client work, personal projects, and everything in between. Click a category to jump to it, or click through to any project for the full context and video.</p>
  <div class="tabs" id="tabs"></div>
  <div class="content-area" id="content"></div>
</main>

<script src="works-data.js"></script>
<script>
  let activeCategory = 'All';

  function extractYouTubeId(url){
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]+)/,
      /(?:youtu\.be\/)([\w-]+)/,
      /(?:youtube\.com\/embed\/)([\w-]+)/,
      /(?:youtube\.com\/shorts\/)([\w-]+)/
    ];
    for (const p of patterns){
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function thumbFor(w){
    if (w.images && w.images.length){
      return `<img src="${w.images[0]}" alt="${w.title}">`;
    }
    if (w.videos && w.videos.length){
      const v = w.videos[0];
      if (v.type === 'youtube'){
        const id = extractYouTubeId(v.url);
        if (id) return `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${w.title}">`;
      }
      if (v.type === 'instagram') return `<span class="platform-label">Instagram clip</span>`;
      if (v.type === 'tiktok') return `<span class="platform-label">TikTok clip</span>`;
    }
    return `<span class="platform-label">No preview</span>`;
  }

  function renderTabs(categories){
    const el = document.getElementById('tabs');
    const all = ['All', ...categories];
    el.innerHTML = all.map(cat => `
      <button class="tab ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>
    `).join('');
    el.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        render();
      });
    });
  }

  function render(){
    const contentEl = document.getElementById('content');
    if (!WORKS || !WORKS.length){
      contentEl.innerHTML = '<div class="empty">Nothing listed yet.</div>';
      return;
    }

    const byCategory = {};
    const order = [];
    WORKS.forEach(w => {
      if (!byCategory[w.category]){
        byCategory[w.category] = [];
        order.push(w.category);
      }
      byCategory[w.category].push(w);
    });

    renderTabs(order);

    const categoriesToShow = activeCategory === 'All' ? order : [activeCategory];

    contentEl.innerHTML = categoriesToShow.map(cat => {
      const items = byCategory[cat] || [];
      const normalItems = items.filter(w => !w.isGalleryLink);
      const galleryLinkItems = items.filter(w => w.isGalleryLink);

      const rows = normalItems.map(w => `
        <a class="row" href="work.html?id=${encodeURIComponent(w.id)}">
          <div class="row-thumb">${thumbFor(w)}</div>
          <div class="row-text">
            <div class="row-title">${w.title}</div>
            <div class="row-credit">${w.blurb}</div>
          </div>
          <div class="row-arrow">View &rarr;</div>
        </a>
      `).join('');

      const galleryLinks = galleryLinkItems.filter(w => w.folder).map(w => `
        <div class="gallery-link-row">
          <span>Looking for more? There's a broader set of ${cat.toLowerCase()} work not individually listed here.</span>
          <a href="${w.folder}" target="_blank" rel="noopener">Browse full gallery &rarr;</a>
        </div>
      `).join('');

      return `<div class="category-block"><h2>${cat}</h2>${rows}${galleryLinks}</div>`;
    }).join('');
  }

  render();
</script>

</body>
</html>
