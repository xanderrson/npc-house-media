<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category | Optiflow Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE3;
    --ink: #201D18;
    --ink-soft: #3A352C;
    --muted: #6B6153;
    --accent: #35563F;
    --line: rgba(32,29,24,0.16);
    --frame-bg: #0E0C0A;
    --frame-muted: #9C9186;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,.display{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
  }
  a{ color:inherit; }
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 28px;
  }

  nav.sitenav{
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:30;
  }
  nav.sitenav .wrap{
    display:flex;
    align-items:center;
    gap:28px;
    padding-top:20px;
    padding-bottom:20px;
    max-width:1000px;
  }
  nav.sitenav a{
    text-decoration:none;
    font-family:'Oswald',sans-serif;
    font-size:0.95rem;
    color:var(--muted);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }
  nav.sitenav a:hover{ color:var(--ink); }

  main{ padding:40px 0 100px; }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.9rem;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
    margin-bottom:24px;
  }
  .back:hover{ border-color:var(--muted); }

  .cat-label{
    font-size:0.85rem;
    color:var(--accent);
    font-family:'Oswald',sans-serif;
    margin-bottom:8px;
  }
  h1{ font-size:clamp(2rem, 5vw, 2.6rem); margin-bottom:8px; }
  .cat-intro{ color:var(--muted); font-size:0.95rem; margin-bottom:36px; }

  /* ---------- COLLAGE ---------- */
  .collage-wrap{
    position:relative;
    margin-bottom:56px;
  }
  .collage-stage{
    position:relative;
    height:480px;
    border:1px dashed var(--line);
  }
  @media (max-width:640px){ .collage-stage{ height:420px; } }

  .chip{
    position:absolute;
    background:var(--bg);
    border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(32,29,24,0.10);
    padding:6px 6px 8px;
    cursor:pointer;
    transition:transform 0.25s ease, box-shadow 0.25s ease, z-index 0s;
  }
  .chip:hover{
    transform:var(--hover-transform) !important;
    box-shadow:0 10px 26px rgba(32,29,24,0.18);
    z-index:50 !important;
  }
  .chip .chip-media{
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    background:var(--frame-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .chip .chip-media img, .chip .chip-media video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .chip .chip-media span{
    color:var(--frame-muted);
    font-size:0.65rem;
    font-family:'Oswald',sans-serif;
    text-align:center;
    padding:0 8px;
  }
  .chip .chip-title{
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:6px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---------- SPOTLIGHT ---------- */
  .scrim{
    position:fixed;
    inset:0;
    background:rgba(32,29,24,0.55);
    backdrop-filter:blur(2px);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  .spotlight{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.94);
    width:min(640px, 90vw);
    max-height:86vh;
    overflow-y:auto;
    background:var(--bg);
    border:1px solid var(--line);
    padding:26px;
    z-index:101;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease, transform 0.3s ease;
    box-shadow:0 24px 60px rgba(32,29,24,0.3);
  }
  .spotlight.open{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
  }
  .spotlight-close{
    position:absolute;
    top:16px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-size:1rem;
    cursor:pointer;
  }
  .spotlight-close:hover{ border-color:var(--accent); }
  .spotlight .video-embed{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:var(--frame-bg);
    overflow:hidden;
    margin-bottom:18px;
  }
  .spotlight .video-embed iframe, .spotlight .video-embed video{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .spotlight .frame-img{
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    background:var(--frame-bg);
    margin-bottom:18px;
  }
  .spotlight .frame-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ig-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:16px 20px;
    border:1px solid var(--line);
    margin-bottom:18px;
  }
  .ig-card span{ color:var(--ink-soft); font-size:0.95rem; }
  .ig-card a{
    text-decoration:none;
    font-weight:600;
    color:var(--accent);
    border-bottom:1px solid var(--accent);
    white-space:nowrap;
  }
  .spotlight .cat{
    font-size:0.78rem;
    color:var(--accent);
    font-family:'Oswald',sans-serif;
    margin-bottom:6px;
  }
  .spotlight h3{ font-size:1.2rem; font-weight:500; margin-bottom:6px; }
  .spotlight p{ color:var(--muted); font-size:0.95rem; max-width:60ch; }
  .spotlight .view-link{
    display:inline-block;
    margin-top:8px;
    font-size:0.9rem;
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }

  /* ---------- LIST (fallback, plain) ---------- */
  .list-head{
    font-size:1.1rem;
    color:var(--ink);
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
  }
  .row-thumb{
    flex-shrink:0;
    width:104px;
    height:78px;
    border-radius:2px;
    overflow:hidden;
    background:var(--frame-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-thumb .platform-label{
    color:var(--frame-muted);
    font-size:0.7rem;
    font-family:'Oswald',sans-serif;
    text-align:center;
    padding:0 6px;
  }
  .row-text{ min-width:0; flex:1; }
  .row-title{
    font-size:1.05rem;
    font-weight:500;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
  }
  .row:hover .row-title{ border-color:var(--accent); }
  .row-credit{ font-size:0.92rem; color:var(--muted); margin-top:4px; }
  .row-arrow{ flex-shrink:0; color:var(--muted); font-size:0.9rem; }

  .empty{ padding:80px 0; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<nav class="sitenav">
  <div class="wrap">
    <a href="index.html">Portfolio</a>
    <a href="all-work.html">All Work</a>
    <a href="personal.html">Gaming</a>
  </div>
</nav>

<main class="wrap">
  <a class="back" href="all-work.html">&larr; Back to All Work</a>
  <div class="cat-label">Category</div>
  <h1 id="cat-title">Category</h1>
  <p class="cat-intro">Click any piece below to bring it forward — the rest stay right where they are.</p>

  <div class="collage-wrap">
    <div class="collage-stage" id="collage-stage"><!-- populated by script --></div>
  </div>

  <div class="list-head">Or browse as a list</div>
  <div id="list-rows"><!-- populated by script --></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="spotlight" id="spotlight">
  <button class="spotlight-close" id="spotlight-close" aria-label="Close">&times;</button>
  <div id="spotlight-content"></div>
</div>

<script src="works-data.js"></script>
<script>
  function extractYouTubeId(url){
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]+)/,
      /(?:youtu\.be\/)([\w-]+)/,
      /(?:youtube\.com\/embed\/)([\w-]+)/,
      /(?:youtube\.com\/shorts\/)([\w-]+)/
    ];
    for (const p of patterns){
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  // small deterministic pseudo-random generator so layout is stable across reloads
  function seeded(i, salt){
    const x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function chipThumb(w){
    if (w.images && w.images.length) return `<img src="${w.images[0]}" alt="${w.title}">`;
    if (w.videos && w.videos.length){
      const v = w.videos[0];
      if (v.type === 'youtube'){
        const id = extractYouTubeId(v.url);
        if (id) return `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${w.title}">`;
      }
      if (v.type === 'video') return `<video src="${v.url}" muted preload="metadata"></video>`;
      if (v.type === 'instagram') return `<span>Instagram clip</span>`;
      if (v.type === 'tiktok') return `<span>TikTok clip</span>`;
      if (v.type === 'medal') return `<span>Medal clip</span>`;
    }
    return `<span>No preview</span>`;
  }

  function fullMedia(w){
    if (w.videos && w.videos.length){
      const v = w.videos[0];
      if (v.type === 'youtube'){
        const id = extractYouTubeId(v.url);
        if (id) return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${id}" title="${w.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      if (v.type === 'medal'){
        const sep = v.url.includes('?') ? '&' : '?';
        return `<div class="video-embed"><iframe src="${v.url}${sep}autoplay=0&muted=0&loop=0" title="${w.title}" frameborder="0" allow="autoplay" allowfullscreen></iframe></div>`;
      }
      if (v.type === 'video') return `<div class="video-embed"><video src="${v.url}" controls playsinline></video></div>`;
      if (v.type === 'instagram') return `<div class="ig-card"><span>This clip lives on Instagram.</span><a href="${v.url}" target="_blank" rel="noopener">Watch on Instagram &rarr;</a></div>`;
      if (v.type === 'tiktok') return `<div class="ig-card"><span>This clip lives on TikTok.</span><a href="${v.url}" target="_blank" rel="noopener">Watch on TikTok &rarr;</a></div>`;
    }
    if (w.images && w.images.length) return `<div class="frame-img"><img src="${w.images[0]}" alt="${w.title}"></div>`;
    return '';
  }

  function thumbFor(w){
    if (w.images && w.images.length) return `<img src="${w.images[0]}" alt="${w.title}">`;
    if (w.videos && w.videos.length){
      const v = w.videos[0];
      if (v.type === 'youtube'){
        const id = extractYouTubeId(v.url);
        if (id) return `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${w.title}">`;
      }
      if (v.type === 'instagram') return `<span class="platform-label">Instagram clip</span>`;
      if (v.type === 'tiktok') return `<span class="platform-label">TikTok clip</span>`;
      if (v.type === 'medal') return `<span class="platform-label">Medal clip</span>`;
      if (v.type === 'video') return `<span class="platform-label">Video</span>`;
    }
    return `<span class="platform-label">No preview</span>`;
  }

  function openSpotlight(w){
    document.getElementById('spotlight-content').innerHTML = `
      ${fullMedia(w)}
      <div class="cat">${w.category}</div>
      <h3>${w.title}</h3>
      <p>${w.blurb}</p>
      <a class="view-link" href="work.html?id=${encodeURIComponent(w.id)}">View full credit &rarr;</a>
    `;
    document.getElementById('scrim').classList.add('open');
    document.getElementById('spotlight').classList.add('open');
  }
  function closeSpotlight(){
    document.getElementById('scrim').classList.remove('open');
    document.getElementById('spotlight').classList.remove('open');
    // stop any playing video/iframe by clearing content after the transition
    setTimeout(() => {
      if (!document.getElementById('spotlight').classList.contains('open')){
        document.getElementById('spotlight-content').innerHTML = '';
      }
    }, 300);
  }

  function layoutChips(items){
    const stage = document.getElementById('collage-stage');
    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;

    const cols = Math.min(items.length, Math.max(3, Math.ceil(Math.sqrt(items.length * (stageW / stageH)))));
    const rows = Math.ceil(items.length / cols);
    const cellW = stageW / cols;
    const cellH = stageH / rows;

    stage.innerHTML = items.map((w, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const chipW = Math.round(cellW * (0.62 + seeded(i, 1) * 0.14));
      const chipH = Math.round(chipW * 0.82);
      const jitterX = (seeded(i, 2) - 0.5) * (cellW * 0.28);
      const jitterY = (seeded(i, 3) - 0.5) * (cellH * 0.28);
      const left = Math.round(col * cellW + (cellW - chipW) / 2 + jitterX);
      const top = Math.round(row * cellH + (cellH - chipH) / 2 + jitterY);
      const rotation = (seeded(i, 4) - 0.5) * 12;
      const z = Math.floor(seeded(i, 5) * 20);

      return `
        <div class="chip"
             data-index="${i}"
             style="left:${left}px; top:${top}px; width:${chipW}px; height:${chipH + 22}px;
                    transform:rotate(${rotation.toFixed(1)}deg); z-index:${z};
                    --hover-transform:rotate(0deg) scale(1.08);">
          <div class="chip-media">${chipThumb(w)}</div>
          <div class="chip-title">${w.title}</div>
        </div>
      `;
    }).join('');

    Array.from(stage.querySelectorAll('.chip')).forEach((chip, i) => {
      chip.addEventListener('click', () => openSpotlight(items[i]));
    });
  }

  function render(){
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat') || '';
    document.getElementById('cat-title').textContent = cat || 'Category';
    document.title = (cat || 'Category') + ' | Optiflow Media';

    const items = (WORKS || []).filter(w => w.category === cat && !w.isGalleryLink);
    const stage = document.getElementById('collage-stage');
    const listEl = document.getElementById('list-rows');

    if (!items.length){
      stage.innerHTML = '<div class="empty">Nothing in this category yet.</div>';
      listEl.innerHTML = '';
      return;
    }

    layoutChips(items);

    listEl.innerHTML = items.map(w => `
      <a class="row" href="work.html?id=${encodeURIComponent(w.id)}">
        <div class="row-thumb">${thumbFor(w)}</div>
        <div class="row-text">
          <div class="row-title">${w.title}</div>
          <div class="row-credit">${w.blurb}</div>
        </div>
        <div class="row-arrow">View &rarr;</div>
      </a>
    `).join('');
  }

  document.getElementById('scrim').addEventListener('click', closeSpotlight);
  document.getElementById('spotlight-close').addEventListener('click', closeSpotlight);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSpotlight(); });

  render();
  window.addEventListener('resize', render);
</script>

</body>
</html>
