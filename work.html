<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected work | Optiflow Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3EEE3;
    --ink: #201D18;
    --ink-soft: #3A352C;
    --muted: #6B6153;
    --accent: #35563F;
    --accent-hover: #2A4530;
    --line: rgba(32,29,24,0.14);
    --frame-bg: #0E0C0A;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  h1,h2,.display{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
  }
  a{ color:inherit; }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:0 28px;
  }

  nav.sitenav{
    border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  nav.sitenav .wrap{
    display:flex;
    align-items:center;
    gap:28px;
    padding-top:20px;
    padding-bottom:20px;
  }
  nav.sitenav a{
    text-decoration:none;
    font-family:'Oswald',sans-serif;
    font-size:0.95rem;
    color:var(--muted);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }
  nav.sitenav a:hover{ color:var(--ink); }
  header{ padding:48px 0 24px; }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.9rem;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease;
  }
  .back:hover{ border-color:var(--muted); }

  main{ padding:16px 0 100px; }
  .cat{
    font-size:0.85rem;
    color:var(--accent);
    font-family:'Oswald',sans-serif;
    margin-bottom:10px;
  }
  h1{ font-size:clamp(2rem, 5vw, 2.6rem); margin-bottom:16px; }
  .blurb{
    color:var(--ink-soft);
    max-width:60ch;
    font-size:1.05rem;
    margin-bottom:40px;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:2px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:40px;
  }
  .gallery .shot{
    aspect-ratio:4/3;
    overflow:hidden;
    background:var(--frame-bg);
  }
  .gallery .shot img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .videos{
    display:flex;
    flex-direction:column;
    gap:24px;
    margin-bottom:40px;
  }
  .video-embed{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:var(--frame-bg);
    overflow:hidden;
  }
  .video-embed iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .ig-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding:18px 22px;
    border:1px solid var(--line);
  }
  .ig-card span{
    color:var(--ink-soft);
    font-size:0.98rem;
  }
  .ig-card a{
    text-decoration:none;
    font-weight:600;
    color:var(--accent);
    border-bottom:1px solid var(--accent);
    white-space:nowrap;
  }
  .tiktok-wrap{
    display:flex;
    justify-content:center;
  }

  .cta-row{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-block;
    padding:13px 24px;
    border-radius:2px;
    font-size:0.95rem;
    text-decoration:none;
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--bg);
    font-weight:600;
    transition:background 0.2s ease;
  }
  .btn:hover{ background:var(--accent-hover); }
  .btn.disabled{
    background:transparent;
    color:var(--muted);
    border-color:var(--line);
    cursor:default;
    pointer-events:none;
  }

  .empty{
    padding:80px 0;
    text-align:center;
    color:var(--muted);
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<nav class="sitenav">
  <div class="wrap">
    <a href="index.html">Portfolio</a>
    <a href="all-work.html">All Work</a>
    <a href="personal.html">Gaming</a>
  </div>
</nav>

<header class="wrap">
  <a class="back" href="index.html" id="back-link">&larr; Back</a>
</header>

<main class="wrap" id="content">
  <!-- populated by script below -->
</main>

<script src="works-data.js"></script>
<script>
  function getEntry(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    return WORKS.find(w => w.id === id);
  }

  function extractYouTubeId(url){
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]+)/,
      /(?:youtu\.be\/)([\w-]+)/,
      /(?:youtube\.com\/embed\/)([\w-]+)/,
      /(?:youtube\.com\/shorts\/)([\w-]+)/
    ];
    for (const p of patterns){
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function renderVideo(v){
    if (v.type === 'youtube'){
      const id = extractYouTubeId(v.url);
      if (!id) return '';
      return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${id}" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    }
    if (v.type === 'instagram'){
      return `<div class="ig-card">
        <span>This clip lives on Instagram.</span>
        <a href="${v.url}" target="_blank" rel="noopener">Watch on Instagram &rarr;</a>
      </div>`;
    }
    if (v.type === 'tiktok'){
      return `<div class="ig-card">
        <span>This clip lives on TikTok.</span>
        <a href="${v.url}" target="_blank" rel="noopener">Watch on TikTok &rarr;</a>
      </div>`;
    }
    if (v.type === 'medal'){
      const sep = v.url.includes('?') ? '&' : '?';
      const src = v.url + sep + 'autoplay=0&muted=0&loop=0';
      return `<div class="video-embed"><iframe src="${src}" title="${v.title || 'Video'}" frameborder="0" allow="autoplay" allowfullscreen></iframe></div>`;
    }
    if (v.type === 'video'){
      return `<div class="video-embed"><video src="${v.url}" controls playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video></div>`;
    }
    return '';
  }

  function render(){
    const el = document.getElementById('content');
    const entry = getEntry();

    if (!entry){
      el.innerHTML = `<div class="empty">
        <p>Couldn't find that project.</p>
        <a class="back" href="index.html">&larr; Back to portfolio</a>
      </div>`;
      return;
    }

    const hasVideo = entry.videos && entry.videos.length;

    const shots = (!hasVideo && entry.images && entry.images.length)
      ? entry.images.map(src => `<div class="shot"><img src="${src}" alt="${entry.title}"></div>`).join('')
      : '';

    const videosHtml = hasVideo
      ? `<div class="videos">${entry.videos.map(renderVideo).join('')}</div>`
      : '';

    const ctaButton = entry.folder
      ? `<a class="btn" href="${entry.folder}" target="_blank" rel="noopener">See full gallery</a>`
      : `<span class="btn disabled">Full gallery coming soon</span>`;

    el.innerHTML = `
      <div class="cat">${entry.category}</div>
      <h1>${entry.title}</h1>
      <p class="blurb">${entry.blurb}</p>
      ${videosHtml}
      <div class="gallery">${shots}</div>
      <div class="cta-row">${ctaButton}</div>
    `;

    document.title = entry.title + " | Optiflow Media";
  }

  render();

  document.getElementById('back-link').addEventListener('click', function(e){
    if (window.history.length > 1){
      e.preventDefault();
      window.history.back();
    }
    // otherwise, let it fall through to the href="index.html" fallback
  });
</script>

</body>
</html>
